<style>

@media (prefers-color-scheme: dark){
:root:not([data-mode="light"]){
--bg:#171716; --card:#22221f; --ink:#ecebe6; --muted:#a3a29b; --line:#3b3a36;
--struct:#d6d5cf; --hatch:#8f8e88; --hl:#4a4215; --accent:#6d9cf5;
--cA:#6d9cf5; --cB:#f59a4a; --cC:#4cc98a; --cD:#f26b6b; --cE:#b29bfb; --cF:#3fc5d8;

}
:root[data-mode="dark"]{
--bg:#171716; --card:#22221f; --ink:#ecebe6; --muted:#a3a29b; --line:#3b3a36;
--struct:#d6d5cf; --hatch:#8f8e88; --hl:#4a4215; --accent:#6d9cf5;
--cA:#6d9cf5; --cB:#f59a4a; --cC:#4cc98a; --cD:#f26b6b; --cE:#b29bfb; --cF:#3fc5d8;

*{box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header h1{font-size:1.35rem;margin:0 0 2px}
header p{margin:0;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
svg#stage{width:100%;height:auto;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-right:6px;vertical-align:-1px}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stephead h2{font-size:1.05rem;margin:0}
.count{color:var(--muted);font-size:.85rem;white-space:nowrap}
#text{margin:8px 0}
#formula{background:var(--bg);border-radius:8px;padding:10px 12px;overflow-x:auto;min-height:2.4em}
#formula:empty{display:none}
.ask{border-left:3px solid var(--accent);padding:6px 10px;margin:10px 0;background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 8px 8px 0}
.ask b{display:block;font-size:.8rem;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dots i.now{background:var(--accent)}
.praxis{margin-top:14px}
.praxis h3{margin:0 0 4px;font-size:1rem}
.praxis .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hidden{display:none!important}
.el{transition:opacity .45s ease}
.el.off{opacity:0;pointer-events:none}
.el.on{opacity:1}
.el.dim{opacity:.28}
.draw path.stroke,.draw line.stroke{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.1s ease-in-out 2}
@keyframes pulse{50%{filter:drop-shadow(0 0 6px var(--hl)) drop-shadow(0 0 2px var(--hl))}}
.hlbox{fill:var(--hl);opacity:.0;transition:opacity .3s}
.el.hl .hlbox{opacity:.9}
svg text{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic}
svg text.up{font-style:normal;font-family:system-ui,sans-serif}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
svg#stage.dreh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
svg#stage.dreh:active{cursor:grabbing}
.vc{cursor:pointer}
.vc-f{fill:var(--card);stroke:var(--muted);stroke-width:1;fill-opacity:.92}
.vc-f:hover{fill:var(--hl)}
.vc-t{font:500 10px system-ui,sans-serif;fill:var(--ink);pointer-events:none;font-style:normal}
.vc-c{fill:var(--muted);fill-opacity:.35}
.vc-c:hover{fill:var(--accent);fill-opacity:1}
.vc-h{font:11px system-ui,sans-serif;fill:var(--muted);font-style:normal}
.vc-h:hover{fill:var(--accent)}
:root:root:root{--bg:var(--surface-1);--card:var(--surface-2);--ink:var(--text-primary);--muted:var(--text-secondary);--line:var(--border-strong);--struct:var(--text-primary);--hatch:var(--text-secondary);--accent:var(--text-accent)}.wrap{padding:0}h1,h2,h3{font-weight:500}.card{border-width:.5px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<div class="wrap">
<div class="grid">
<div class="card">
<svg id="stage" viewBox="0 0 600 380" role="img" aria-label="Skizze"></svg>

</div>

<div id="formula"></div>
<div class="controls">

</div>
</div>

</div>
</div>
